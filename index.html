<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paste-to-Invoice</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'DM Mono',monospace;background:#f7f4ee;color:#1a1a1a;min-height:100vh}
  .app{display:grid;grid-template-columns:300px 1fr 1fr;min-height:100vh}
  @media(max-width:900px){.app{grid-template-columns:1fr}}
  .sidebar{background:#1a1a1a;color:#f7f4ee;display:flex;flex-direction:column;padding:2rem 1.25rem;gap:1rem;overflow-y:auto}
  .sidebar h2{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:400;font-style:italic;color:#f7f4ee;margin-bottom:.25rem}
  .sidebar .sub{font-size:10px;letter-spacing:.06em;color:#888;margin-bottom:.75rem}
  .history-list{display:flex;flex-direction:column;gap:.5rem;flex:1}
  .history-item{background:#2a2a2a;border-radius:4px;padding:.75rem 1rem;cursor:pointer;transition:background .15s;border:1px solid transparent}
  .history-item:hover{background:#333;border-color:#444}
  .history-item.active{border-color:#f7f4ee44}
  .history-item .hi-to{font-size:12px;font-weight:500;color:#f7f4ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .history-item .hi-meta{font-size:10px;color:#888;margin-top:2px;display:flex;justify-content:space-between}
  .history-item .hi-total{font-size:11px;color:#bdb9b0;margin-top:4px}
  .del-btn{background:none;border:none;color:#555;cursor:pointer;font-size:11px;padding:2px 4px;border-radius:2px;transition:color .15s}
  .del-btn:hover{color:#e25}
  .empty-history{font-size:11px;color:#555;text-align:center;margin-top:2rem;line-height:1.6}
  .left{padding:2rem 1.75rem;border-right:1px solid #d4cfc4;display:flex;flex-direction:column;gap:1.25rem;overflow-y:auto}
  .right{padding:2rem 1.75rem;background:#fff;display:flex;flex-direction:column;gap:1.25rem;overflow-y:auto}
  h1{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:600;line-height:1.2;color:#1a1a1a}
  h1 span{font-style:italic;color:#7c6f5b}
  .tag{display:inline-block;font-size:10px;letter-spacing:.08em;background:#1a1a1a;color:#f7f4ee;padding:3px 8px;border-radius:2px;margin-bottom:.5rem}
  label{font-size:11px;letter-spacing:.06em;color:#7c6f5b;display:block;margin-bottom:5px}
  textarea{width:100%;border:1px solid #d4cfc4;border-radius:4px;padding:.875rem;font-family:'DM Mono',monospace;font-size:13px;background:#faf8f4;color:#1a1a1a;resize:vertical;min-height:130px;outline:none;transition:border-color .2s}
  textarea:focus{border-color:#1a1a1a}
  input[type=text],input[type=number]{width:100%;border:1px solid #d4cfc4;border-radius:4px;padding:.6rem .75rem;font-family:'DM Mono',monospace;font-size:13px;background:#faf8f4;color:#1a1a1a;outline:none;transition:border-color .2s}
  input:focus{border-color:#1a1a1a}
  select{border:1px solid #d4cfc4;border-radius:4px;padding:.6rem .75rem;font-family:'DM Mono',monospace;font-size:13px;background:#faf8f4;color:#1a1a1a;outline:none;width:100%}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:.875rem}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}
  .btn-primary{background:#1a1a1a;color:#f7f4ee;border:none;border-radius:4px;padding:.75rem 1.5rem;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;cursor:pointer;width:100%;transition:opacity .2s}
  .btn-primary:hover{opacity:.85}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-secondary{background:transparent;color:#1a1a1a;border:1px solid #d4cfc4;border-radius:4px;padding:.65rem 1rem;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.04em;cursor:pointer;transition:background .2s;white-space:nowrap}
  .btn-secondary:hover{background:#f0ece4}
  .btn-secondary:disabled{opacity:.4;cursor:not-allowed}
  .btn-email{background:#f0ece4;color:#1a1a1a;border:1px solid #d4cfc4;border-radius:4px;padding:.65rem 1rem;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.04em;cursor:pointer;transition:background .2s;white-space:nowrap}
  .btn-email:hover{background:#e8e4dc}
  .btn-email:disabled{opacity:.4;cursor:not-allowed}
  .status{font-size:11px;color:#7c6f5b;text-align:center;min-height:16px}
  .loading-msg{color:#7c6f5b;font-size:11px;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .invoice-shell{flex:1;border:1px solid #e8e4dc;border-radius:6px;overflow:hidden;min-height:400px}
  .inv-header{background:#1a1a1a;color:#f7f4ee;padding:1.75rem 2rem 1.25rem;font-family:'Fraunces',serif}
  .inv-header-top{display:flex;justify-content:space-between;align-items:flex-start}
  .inv-logo{max-height:48px;max-width:120px;object-fit:contain;border-radius:2px}
  .inv-logo-placeholder{width:48px;height:48px;background:#333;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#666}
  .inv-header .inv-title{font-size:1.75rem;font-weight:400;font-style:italic;margin-bottom:.2rem}
  .inv-header .inv-num{font-family:'DM Mono',monospace;font-size:11px;opacity:.6;letter-spacing:.08em}
  .inv-meta{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1.25rem 2rem;background:#f9f7f2;border-bottom:1px solid #e8e4dc;font-size:12px}
  .inv-meta-block label{font-size:10px;letter-spacing:.08em;color:#7c6f5b;display:block;margin-bottom:3px}
  .inv-meta-block p{color:#1a1a1a;font-size:13px}
  .inv-items{padding:1.25rem 2rem}
  .inv-items table{width:100%;border-collapse:collapse;font-size:13px}
  .inv-items th{text-align:left;font-size:10px;letter-spacing:.08em;color:#7c6f5b;border-bottom:1px solid #e8e4dc;padding-bottom:.5rem;font-weight:400}
  .inv-items th:last-child,.inv-items td:last-child{text-align:right}
  .inv-items td{padding:.55rem 0;border-bottom:1px solid #f0ece4;color:#1a1a1a;vertical-align:top}
  .inv-items tr:last-child td{border-bottom:none}
  .inv-totals{margin-top:.875rem;border-top:1px solid #e8e4dc;padding-top:.875rem}
  .inv-totals .line{display:flex;justify-content:space-between;font-size:13px;padding:.25rem 0;color:#7c6f5b}
  .inv-totals .total-line{display:flex;justify-content:space-between;font-size:15px;font-weight:500;color:#1a1a1a;border-top:1px solid #1a1a1a;margin-top:.5rem;padding-top:.75rem}
  .inv-footer{padding:.875rem 2rem 1.25rem;font-size:11px;color:#b0a998;border-top:1px solid #f0ece4}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:300px;color:#b0a998;font-size:12px;gap:.5rem;text-align:center;padding:2rem}
  .empty-state .big{font-family:'Fraunces',serif;font-size:2.5rem;opacity:.3;font-style:italic}
  .item-tag{display:inline-block;font-size:9px;background:#e8e4dc;color:#7c6f5b;padding:2px 6px;border-radius:2px;margin-left:6px;vertical-align:middle}
  .top-bar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
  .top-bar-btns{display:flex;gap:.5rem}
  .note-area{background:#fffbe6;border:1px solid #e8d98a;border-radius:4px;padding:.75rem 1rem;font-size:12px;color:#7a6f00;line-height:1.6}
  .logo-upload{display:flex;align-items:center;gap:.75rem}
  .logo-preview{width:40px;height:40px;border-radius:3px;object-fit:contain;border:1px solid #d4cfc4;background:#faf8f4;display:none}
  .logo-upload-btn{font-size:11px;color:#7c6f5b;cursor:pointer;border:1px dashed #d4cfc4;border-radius:4px;padding:.4rem .75rem;transition:border-color .2s}
  .logo-upload-btn:hover{border-color:#7c6f5b}
  .section-divider{font-size:10px;letter-spacing:.08em;color:#b0a998;border-top:1px solid #e8e4dc;padding-top:.875rem;margin-top:-.125rem}
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR: History -->
  <div class="sidebar">
    <div>
      <h2>Invoice History</h2>
      <p class="sub">SAVED INVOICES</p>
    </div>
    <div class="history-list" id="historyList">
      <p class="empty-history">No invoices yet.<br>Generate one to see it here.</p>
    </div>
  </div>

  <!-- LEFT: Input -->
  <div class="left">
    <div>
      <div class="tag">PASTE-TO-INVOICE</div>
      <h1>Turn your notes<br>into a <span>clean invoice</span></h1>
    </div>

    <div class="section-divider">BRANDING</div>

    <div>
      <label>YOUR LOGO (OPTIONAL)</label>
      <div class="logo-upload">
        <img id="logoPreview" class="logo-preview" alt="logo" />
        <label class="logo-upload-btn" for="logoInput">+ Upload logo</label>
        <input type="file" id="logoInput" accept="image/*" style="display:none" />
        <span id="logoRemove" style="font-size:11px;color:#b0a998;cursor:pointer;display:none" onclick="removeLogo()">remove</span>
      </div>
    </div>

    <div class="section-divider">DETAILS</div>

    <div>
      <label>YOUR WORK NOTES</label>
      <textarea id="notes" placeholder="e.g.&#10;3hrs React work on dashboard&#10;2hrs client meetings&#10;fixed auth bug - 45min&#10;design review 1.5 hours&#10;wrote API docs"></textarea>
    </div>

    <div class="row">
      <div>
        <label>YOUR NAME / COMPANY</label>
        <input type="text" id="from" placeholder="Jane Smith" />
      </div>
      <div>
        <label>BILL TO</label>
        <input type="text" id="to" placeholder="Acme Corp" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>CLIENT EMAIL (FOR MAILTO)</label>
        <input type="text" id="clientEmail" placeholder="client@example.com" />
      </div>
      <div>
        <label>PAYMENT TERMS</label>
        <input type="text" id="payment" placeholder="Net 14 days" />
      </div>
    </div>

    <div class="row3">
      <div>
        <label>RATE / HOUR</label>
        <input type="number" id="rate" placeholder="150" />
      </div>
      <div>
        <label>CURRENCY</label>
        <select id="currency">
          <option value="$">USD $</option>
          <option value="€">EUR €</option>
          <option value="£">GBP £</option>
          <option value="₺">TRY ₺</option>
          <option value="₼">AZN ₼</option>
          <option value="₹">INR ₹</option>
          <option value="¥">JPY ¥</option>
          <option value="C$">CAD C$</option>
          <option value="A$">AUD A$</option>
          <option value="CHF">CHF</option>
        </select>
      </div>
      <div>
        <label>TAX %</label>
        <input type="number" id="tax" placeholder="0" />
      </div>
    </div>

    <button class="btn-primary" id="parseBtn">PARSE & GENERATE INVOICE →</button>
    <div class="status" id="status"></div>
    <div class="note-area" id="noteArea" style="display:none"></div>
  </div>

  <!-- RIGHT: Preview -->
  <div class="right">
    <div class="top-bar">
      <span style="font-size:11px;letter-spacing:.06em;color:#7c6f5b">PREVIEW</span>
      <div class="top-bar-btns">
        <button class="btn-email"      id="emailBtn"  disabled>EMAIL ✉</button>
        <button class="btn-secondary"  id="copyBtn"   disabled>COPY</button>
        <button class="btn-primary"    id="printBtn"  style="width:auto;padding:.65rem 1rem" disabled>PRINT / PDF</button>
      </div>
    </div>

    <div class="invoice-shell" id="invoiceShell">
      <div class="empty-state">
        <div class="big">invoice</div>
        <p>Paste your work notes on the left<br>and hit generate</p>
      </div>
    </div>
  </div>

</div>

<script>
  const BACKEND = 'paste-to-invoice-8dmm.vercel.app';
  let currentInvoice = null;
  let logoDataUrl = null;

  // --- Logo handling ---
  document.getElementById('logoInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      logoDataUrl = ev.target.result;
      const prev = document.getElementById('logoPreview');
      prev.src = logoDataUrl;
      prev.style.display = 'block';
      document.getElementById('logoRemove').style.display = 'inline';
    };
    reader.readAsDataURL(file);
  });

  function removeLogo() {
    logoDataUrl = null;
    document.getElementById('logoPreview').style.display = 'none';
    document.getElementById('logoRemove').style.display = 'none';
    document.getElementById('logoInput').value = '';
  }

  // --- Helpers ---
  function setStatus(msg) { document.getElementById('status').textContent = msg; }

  function fmt(n, currency) {
    return currency + Number(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // --- Generate ---
  async function parseNotes() {
    const notes    = document.getElementById('notes').value.trim();
    const from     = document.getElementById('from').value.trim() || 'Your Name';
    const to       = document.getElementById('to').value.trim() || 'Client';
    const rate     = parseFloat(document.getElementById('rate').value) || 0;
    const currency = document.getElementById('currency').value;
    const tax      = parseFloat(document.getElementById('tax').value) || 0;
    const payment  = document.getElementById('payment').value.trim();

    if (!notes) { setStatus('Please paste some work notes first.'); return; }

    setStatus('');
    document.getElementById('noteArea').style.display = 'none';
    document.getElementById('parseBtn').disabled = true;
    document.getElementById('invoiceShell').innerHTML =
      '<div class="empty-state"><div class="loading-msg">parsing your notes...</div></div>';

    const today   = new Date();
    const dateStr = today.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
    const invNum  = 'INV-' + today.getFullYear() +
                    String(today.getMonth() + 1).padStart(2, '0') +
                    String(today.getDate()).padStart(2, '0');

    try {
      const res = await fetch(`${BACKEND}/api/invoice`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notes, rate, currency, from_name: from, to_name: to, date: dateStr, inv_number: invNum, tax, payment }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Server error ' + res.status);
      }

      const parsed = await res.json();
      currentInvoice = { from, to, date: dateStr, invNum, items: parsed.items, currency, tax, payment };

      if (parsed.notes) {
        document.getElementById('noteArea').textContent = '⚠ ' + parsed.notes;
        document.getElementById('noteArea').style.display = 'block';
      }

      renderInvoice(currentInvoice);
      ['copyBtn','printBtn','emailBtn'].forEach(id => document.getElementById(id).disabled = false);
      loadHistory();

    } catch (e) {
      document.getElementById('invoiceShell').innerHTML =
        '<div class="empty-state"><p>Error: ' + e.message + '</p></div>';
      setStatus(e.message);
    }
    document.getElementById('parseBtn').disabled = false;
  }

  // --- Render ---
  function renderInvoice(inv) {
    const { from, to, date, invNum, items, currency, tax, payment } = inv;
    const subtotal = items.reduce((s, i) => s + (i.amount || 0), 0);
    const taxAmt   = subtotal * (tax / 100);
    const total    = subtotal + taxAmt;

    const logoHTML = logoDataUrl
      ? `<img class="inv-logo" src="${logoDataUrl}" alt="logo" />`
      : '';

    const rows = items.map(i => `
      <tr>
        <td>${i.description}${i.type === 'fixed' ? '<span class="item-tag">fixed</span>' : ''}</td>
        <td style="color:#7c6f5b">${i.hours != null ? i.hours + ' hrs' : '—'}</td>
        <td>${fmt(i.amount, currency)}</td>
      </tr>`).join('');

    const taxRow = tax > 0
      ? `<div class="line"><span>Tax (${tax}%)</span><span>${fmt(taxAmt, currency)}</span></div>` : '';

    document.getElementById('invoiceShell').innerHTML = `
      <div class="inv-header">
        <div class="inv-header-top">
          <div>
            <div class="inv-title">Invoice</div>
            <div class="inv-num">${invNum}</div>
          </div>
          ${logoHTML}
        </div>
      </div>
      <div class="inv-meta">
        <div class="inv-meta-block"><label>FROM</label><p>${from}</p></div>
        <div class="inv-meta-block"><label>TO</label><p>${to}</p></div>
        <div class="inv-meta-block"><label>DATE</label><p>${date}</p></div>
        <div class="inv-meta-block"><label>DUE</label><p>${payment || 'On receipt'}</p></div>
      </div>
      <div class="inv-items">
        <table>
          <thead><tr><th>Description</th><th>Hours</th><th>Amount</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="inv-totals">
          <div class="line"><span>Subtotal</span><span>${fmt(subtotal, currency)}</span></div>
          ${taxRow}
          <div class="total-line"><span>Total</span><span>${fmt(total, currency)}</span></div>
        </div>
      </div>
      <div class="inv-footer">Thank you for your business.${payment ? ' Payment: ' + payment + '.' : ''}</div>`;
  }

  // --- History ---
  async function loadHistory() {
    try {
      const res = await fetch(`${BACKEND}/api/history`);
      if (!res.ok) return;
      const invoices = await res.json();
      const list = document.getElementById('historyList');

      if (!invoices.length) {
        list.innerHTML = '<p class="empty-history">No invoices yet.<br>Generate one to see it here.</p>';
        return;
      }

      list.innerHTML = invoices.map(inv => `
        <div class="history-item" onclick="loadInvoice('${inv.id}', this)" data-id="${inv.id}">
          <div class="hi-to">${inv.to_name}</div>
          <div class="hi-meta">
            <span>${inv.from_name}</span>
            <button class="del-btn" onclick="deleteInvoice(event, '${inv.id}')">✕</button>
          </div>
          <div class="hi-meta"><span>${inv.date}</span><span>${inv.inv_number}</span></div>
          <div class="hi-total">${inv.currency}${Number(inv.total).toFixed(2)}</div>
        </div>`).join('');
    } catch(e) {
      console.error('History load failed', e);
    }
  }

  function loadInvoice(id, el) {
    document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    // Re-fetch full invoice from history and render
    fetch(`${BACKEND}/api/history`).then(r => r.json()).then(invoices => {
      const inv = invoices.find(i => i.id === id);
      if (!inv) return;
      currentInvoice = {
        from: inv.from_name, to: inv.to_name, date: inv.date,
        invNum: inv.inv_number, items: inv.items,
        currency: inv.currency, tax: inv.tax, payment: inv.payment
      };
      renderInvoice(currentInvoice);
      ['copyBtn','printBtn','emailBtn'].forEach(id => document.getElementById(id).disabled = false);
    });
  }

  async function deleteInvoice(e, id) {
    e.stopPropagation();
    if (!confirm('Delete this invoice?')) return;
    await fetch(`${BACKEND}/api/delete?id=${id}`, { method: 'DELETE' });
    loadHistory();
  }

  // --- Email ---
  document.getElementById('emailBtn').addEventListener('click', () => {
    if (!currentInvoice) return;
    const { from, to, date, invNum, items, currency, tax, payment } = currentInvoice;
    const subtotal = items.reduce((s, i) => s + (i.amount || 0), 0);
    const taxAmt   = subtotal * (tax / 100);
    const total    = subtotal + taxAmt;
    const f = n => currency + Number(n || 0).toFixed(2);

    const clientEmail = document.getElementById('clientEmail').value.trim();
    const subject = encodeURIComponent(`Invoice ${invNum} from ${from}`);

    let body = `Hi,\n\nPlease find your invoice below.\n\n`;
    body += `INVOICE ${invNum}\n${date}\n\nFrom: ${from}\nTo: ${to}\n\n`;
    body += `─────────────────────────\n`;
    items.forEach(i => {
      body += `${i.description}${i.hours ? ` (${i.hours}h)` : ''} — ${f(i.amount)}\n`;
    });
    body += `─────────────────────────\n`;
    body += `Subtotal: ${f(subtotal)}\n`;
    if (tax > 0) body += `Tax (${tax}%): ${f(taxAmt)}\n`;
    body += `Total: ${f(total)}\n`;
    if (payment) body += `\nPayment terms: ${payment}\n`;
    body += `\nThank you for your business.\n\n${from}`;

    window.location.href = `mailto:${clientEmail}?subject=${subject}&body=${encodeURIComponent(body)}`;
  });

  // --- Print ---
  document.getElementById('printBtn').addEventListener('click', () => {
    const shell = document.getElementById('invoiceShell').innerHTML;
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html><html><head><title>Invoice</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono',monospace;background:#fff;color:#1a1a1a;padding:3rem;max-width:720px;margin:0 auto}
.inv-header{background:#1a1a1a;color:#f7f4ee;padding:2rem;border-radius:6px 6px 0 0;font-family:'Fraunces',serif}
.inv-header-top{display:flex;justify-content:space-between;align-items:flex-start}
.inv-logo{max-height:48px;max-width:120px;object-fit:contain;border-radius:2px}
.inv-title{font-size:2rem;font-style:italic;font-weight:400;margin-bottom:.25rem}
.inv-num{font-family:'DM Mono',monospace;font-size:11px;opacity:.6;letter-spacing:.08em}
.inv-meta{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1.5rem 2rem;background:#f9f7f2;border:1px solid #e8e4dc}
.inv-meta-block label{font-size:10px;color:#7c6f5b;display:block;margin-bottom:3px;letter-spacing:.08em}
.inv-meta-block p{color:#1a1a1a;font-size:13px}
.inv-items{padding:1.5rem 2rem;border:1px solid #e8e4dc;border-top:none;border-radius:0 0 6px 6px}
.inv-items table{width:100%;border-collapse:collapse;font-size:13px}

    w.document.close();
    setTimeout(() => w.print(), 800);
  });

  // --- Copy ---
  document.getElementById('copyBtn').addEventListener('click', () => {
    if (!currentInvoice) return;
    const { from, to, date, invNum, items, currency, tax, payment } = currentInvoice;
    const subtotal = items.reduce((s, i) => s + (i.amount || 0), 0);
    const taxAmt   = subtotal * (tax / 100);
    const total    = subtotal + taxAmt;
    const f = n => currency + Number(n || 0).toFixed(2);

    let text = `INVOICE ${invNum}\n${date}\n\nFrom: ${from}\nTo: ${to}\n\n`;
    items.forEach(i => { text += `${i.description}${i.hours ? ` (${i.hours}h)` : ''} — ${f(i.amount)}\n`; });
    text += `\nSubtotal: ${f(subtotal)}`;
    if (tax > 0) text += `\nTax (${tax}%): ${f(taxAmt)}`;
    text += `\nTotal: ${f(total)}`;
    if (payment) text += `\n\nPayment: ${payment}`;

    navigator.clipboard.writeText(text)
      .then(() => setStatus('Copied to clipboard!'))
      .catch(() => setStatus('Could not copy — try manually.'));
  });

  document.getElementById('parseBtn').addEventListener('click', parseNotes);

  // Load history on startup
  loadHistory();
</script>
